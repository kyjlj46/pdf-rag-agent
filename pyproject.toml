[project]
name = "pdf-rag-agent"
version = "0.1.0"
description = "deepagents 기반 PDF RAG (파싱/OCR/청킹/검색 서브에이전트)"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "deepagents>=0.7.34",
    "fastapi>=0.162.2",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "olefile>=0.47",
    "onnxruntime==1.20.1",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pywin32>=312; sys_platform == 'win32'",
    "rank-bm25>=0.2.2",
    "rapidocr>=3.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
